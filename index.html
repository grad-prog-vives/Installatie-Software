<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graduaat Programmeren Vives Kortrijk</title>
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <!-- HEADER -->
    <div id="header"></div>

    <div class="container">

        <!-- SIDEBAR -->
        <div id="sidebar"></div>

        <!-- INHOUD -->
        <main id="content"></main>
    </div>

    <!-- Vergrote figuur -->
    <div id="lightbox">
        <img src="" alt="">
    </div>
        <script>
        // HEADER laden
        const headerPromise = fetch("header.html")
            .then(r => r.text())
            .then(t => document.getElementById("header").innerHTML = t);

        // SIDEBAR laden
        const sidebarPromise = fetch("sidebar.html")
            .then(r => r.text())
            .then(t => document.getElementById("sidebar").innerHTML = t);


        // DROPDOWNS openen/sluiten
        document.addEventListener("click", e => {
            const toggle = e.target.closest(".dropdown-toggle");
            document.querySelectorAll(".dropdown.open").forEach(d => {
                if (!toggle || d !== toggle.parentElement) d.classList.remove("open");
            });
            if (toggle) toggle.parentElement.classList.toggle("open");
            if (e.target.closest(".dropdown-menu a")) {
                document.querySelectorAll(".dropdown.open").forEach(d => d.classList.remove("open"));
            }
        });

        // Bij hover over een ander menu: open geklikte menu's sluiten
        document.addEventListener("mouseover", e => {
            const dd = e.target.closest(".dropdown");
            if (!dd) return;
            document.querySelectorAll(".dropdown.open").forEach(d => {
                if (d !== dd) d.classList.remove("open");
            });
        });

        // INHOUD dynamisch laden
        function loadPage(page) {

            fetch(page)
                .then(r => r.text())
                .then(t => document.getElementById("content").innerHTML = t);
        }

        // Startpagina
        const params = new URLSearchParams(window.location.search);
        if(params && params.get("p")) {
            const page = params.get("p");
            loadPage(`pages/${page}`);
        }
        else{
            loadPage("pages/home.html");
        }

        // FIGUREN vergroten bij klikken
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = lightbox.querySelector("img");

        document.addEventListener("click", e => {
            const figuur = e.target.closest("img.figuur");
            if (figuur) {
                lightboxImg.src = figuur.src;
                lightboxImg.alt = figuur.alt;
                lightbox.classList.add("open");
            } else if (e.target.closest("#lightbox")) {
                lightbox.classList.remove("open");   // klik op de vergroting = sluiten
            }
        });

        // Sluiten met de Esc-toets
        document.addEventListener("keydown", e => {
            if (e.key === "Escape") lightbox.classList.remove("open");
        });
    </script>       

</body>
</html>
